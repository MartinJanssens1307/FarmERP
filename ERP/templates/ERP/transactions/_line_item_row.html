<tr id="line-item-{{ form.prefix }}" class="item-row border-b border-gray-200 hover:bg-gray-50">
    <td class="px-5 py-5 text-sm">
        {{ form.product }}
    </td>
    <td class="px-5 py-5 text-sm">
        {{ form.quantity }}
    </td>
    <td class="px-5 py-5 text-sm">
        {{ form.unit_price_net }}
    </td>
    <td class="px-5 py-5 text-sm">
        {{ form.vat_rate_percentage }}
    </td>
    <td id="line-total-{{ form.prefix }}" class="px-5 py-5 text-sm font-semibold text-gray-900">
        €{{ form.instance.total_gross|default:"0.00" }}
    </td>
</tr>
